<!-- Scroll effect -->
<script>
  window.addEventListener("load", () => {
    const card = document.querySelector(".rsvp-card");
    if (window.innerWidth <= 600)
    return; 
    if (!card || window.scrollY > 50) 
    return;

    const html = document.documentElement;
    html.style.scrollBehavior = "auto";

    let cancelled = false;

    function cancelAutoScroll() {
      cancelled = true;
      html.style.scrollBehavior = "";
    }

    window.addEventListener("wheel", cancelAutoScroll, {
      once: true,
      passive: true
    });

    window.addEventListener("touchstart", cancelAutoScroll, {
      once: true,
      passive: true
    });

    window.addEventListener("pointerdown", cancelAutoScroll, {
      once: true
    });

    window.addEventListener("keydown", cancelAutoScroll, {
      once: true
    });

    const start = window.scrollY;

    const end =
      start + card.getBoundingClientRect().top - window.innerHeight * 0.00;

    const duration = 8000;
    const startTime = performance.now();

    function scroll(timestamp) {
      if (cancelled) return;

      const progress = Math.min((timestamp - startTime) / duration, 1);

      window.scrollTo(0, start + (end - start) * progress);

      if (progress < 1) {
        requestAnimationFrame(scroll);
      } else {
        html.style.scrollBehavior = "";
      }
    }

    requestAnimationFrame(scroll);
  });
</script>
